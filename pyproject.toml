[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-video-prompter"
version = "0.1.0"
description = "Automated Prompt Compilation and Multi-Modal Continuity Orchestration for Generative AI Video Production"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "websocket-client>=1.7",
    "fountain-tools>=0.0.7",
    "lxml>=5.0",
    "rich>=13.0",
    "typer>=0.12",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio", "black", "ruff", "mypy"]

[project.scripts]
avp = "avp.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["avp*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
